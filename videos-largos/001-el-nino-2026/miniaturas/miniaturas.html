<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const W=1280,H=720,C=document.getElementById('c'),x=C.getContext('2d');
const IM={}; const load=(k,src)=>new Promise(r=>{const i=new Image();i.onload=()=>{IM[k]=i;r()};i.src=src;});
function cover(img,dx,dy,dw,dh,z=1,ox=.5,oy=.5,f=''){const s=Math.max(dw/img.width,dh/img.height)*z,w=img.width*s,h=img.height*s;
  x.save();x.beginPath();x.rect(dx,dy,dw,dh);x.clip();x.filter=f;x.drawImage(img,dx+(dw-w)*ox,dy+(dh-h)*oy,w,h);x.restore();}
function txt(t,X,Y,size,col,{al='left',stroke=12,glow=null,rot=0}={}){x.save();x.translate(X,Y);x.rotate(rot);x.font=`900 ${size}px Inter`;x.textAlign=al;x.textBaseline='alphabetic';
  if(glow){x.shadowColor=glow;x.shadowBlur=40;} x.lineJoin='round';x.lineWidth=stroke;x.strokeStyle='#000';x.strokeText(t,0,0);x.shadowBlur=0;x.fillStyle=col;x.fillText(t,0,0);x.restore();}
function chip(t,X,Y,bg,col='#fff',size=34){x.save();x.font=`900 ${size}px Inter`;const w=x.measureText(t).width+36;x.fillStyle=bg;x.fillRect(X,Y,w,size*1.5);x.fillStyle=col;x.textBaseline='middle';x.fillText(t,X+18,Y+size*.78);x.restore();}
function vign(a=.6){const g=x.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,W,H);}
function arrow(x1,y1,x2,y2,col='#ff2b2b'){x.save();x.strokeStyle=col;x.fillStyle=col;x.lineWidth=18;x.lineCap='round';x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=12;
  x.beginPath();x.moveTo(x1,y1);x.quadraticCurveTo((x1+x2)/2+40,(y1+y2)/2-60,x2,y2);x.stroke();const a=Math.atan2(y2-((y1+y2)/2-60),x2-((x1+x2)/2+40));
  x.beginPath();x.moveTo(x2+Math.cos(a)*10,y2+Math.sin(a)*10);x.lineTo(x2-Math.cos(a-.5)*50,y2-Math.sin(a-.5)*50);x.lineTo(x2-Math.cos(a+.5)*50,y2-Math.sin(a+.5)*50);x.closePath();x.fill();x.restore();}
function ring(X,Y,rx,ry,col='#ff2b2b'){x.save();x.strokeStyle=col;x.lineWidth=12;x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=10;x.beginPath();x.ellipse(X,Y,rx,ry,-.08,0,Math.PI*2);x.stroke();x.restore();}
const V={
 A(){ // ¿PEOR QUE 1997?
  cover(IM.calle,0,0,W,H,1.15,.6,.6,'contrast(1.2) saturate(1.25) brightness(.9)'); vign(.7);
  const g=x.createLinearGradient(0,0,W*.6,0);g.addColorStop(0,'rgba(0,0,0,.85)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  ring(905,505,170,60); arrow(640,250,800,450);
  txt('¿PEOR',50,250,150,'#fff'); txt('QUE 1997?',50,410,150,'#ffd23f',{glow:'rgba(255,210,63,.6)'});
  chip('EL NIÑO 2026',56,470,'#e02b2b');
 },
 B(){ // 1997 vs 2026 ¿OTRA VEZ?
  cover(IM.arch,0,0,W/2,H,1.1,.5,.5,'grayscale(1) contrast(1.25) brightness(.85)'); cover(IM.calle,W/2,0,W/2,H,1.15,.55,.5,'contrast(1.2) saturate(1.3)');
  vign(.55); x.fillStyle='#ffd23f';x.save();x.translate(W/2,0);x.beginPath();x.moveTo(-14,0);x.lineTo(30,250);x.lineTo(-10,260);x.lineTo(26,H);x.lineTo(-20,H);x.lineTo(-40,330);x.lineTo(0,320);x.lineTo(-40,0);x.closePath();x.fill();x.restore();
  chip('1997',40,36,'#000','#fff',46); chip('recreación',40,112,'rgba(0,0,0,.6)','#ddd',22); chip('2026',W-200,36,'#e02b2b','#fff',46);
  const g=x.createLinearGradient(0,H*.55,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.85)');x.fillStyle=g;x.fillRect(0,H*.55,W,H*.45);
  txt('¿OTRA VEZ?',W/2,660,170,'#ffd23f',{al:'center',stroke:16,glow:'rgba(255,210,63,.55)',rot:-.03});
 },
 C(){ // 29 °C
  cover(IM.rayo,0,0,W,H,1.1,.5,.4,'contrast(1.2) saturate(1.2) brightness(.8)'); vign(.75);
  x.fillStyle='rgba(120,0,0,.25)';x.fillRect(0,0,W,H);
  chip('MAR DE ECUADOR',60,60,'#000','#fff',38);
  txt('29 °C',60,450,300,'#ff3b2f',{stroke:18,glow:'rgba(255,60,40,.9)'});
  txt('+7 °C SOBRE LO NORMAL',66,560,62,'#fff',{stroke:10}); chip('MÁS QUE EN 1997',66,600,'#ffd23f','#000',44);
 }};
async function hacer(v){x.clearRect(0,0,W,H);V[v]();return C.toDataURL('image/jpeg',.93);}
</script></body></html>
