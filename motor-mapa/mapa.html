<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fredoka; src: url(datos/fuentes/Fredoka.ttf); font-weight: 300 700; }
@font-face { font-family: Montserrat; src: url(datos/fuentes/Montserrat.ttf); font-weight: 100 900; }
@font-face { font-family: Fell; src: url(datos/fuentes/IMFell.ttf); font-weight: 400; }
@font-face { font-family: Fell; src: url(datos/fuentes/IMFell-it.ttf); font-style: italic; }
html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Motor de mapas Goods Uncovered: estilo "documental" (relieve satelital) y "caricatura" (países con bandera y ojos).
let W = 1920, H = 1080; const S = 1000, N = 512;
const Y = v => v + (SP.offsetY || 0), X = v => v === 960 ? W / 2 : v, OCULTO = k => (SP.ocultar || []).includes(k);
function encajar(anchos, max) { return Math.min(1, max / Math.max(1, ...anchos)); }
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const NAVY = '#07121b', ACC = '#ffd23f', RED = '#d6453d', WHITE = '#ffffff', TXT = '#cfd6dc';
const ESTADOS = { LLORA: '#4ea3ff', 'LE AFECTA': '#ffd23f', 'NI LO NOTA': '#3bc47a', CELEBRA: '#ff5a4e', 'YA NO EXISTE': '#9aa5ae' }, CUATRO = ['LLORA', 'LE AFECTA', 'NI LO NOTA', 'CELEBRA'];
let G, SP, FLC = {}, FLCOL = {}, IM = {}, TIL = {}, PAT = {}, CAM, FACE = {}, OFF, octx, GRANO;

const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, p) => a + (b - a) * p;
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, eo = p => 1 - Math.pow(1 - p, 3);
const eob = p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const pr = (t, a, d) => cl((t - a) / d);
const hsh = s => { let h = 2166136261; for (const ch of String(s)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };
function proj(lon, lat) { lat = cl(lat, -85, 85); return [(lon + 180) / 360 * S, (1 - Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)) / Math.PI) / 2 * S]; }
const ws = (lon, lat) => { const [x, y] = proj(lon, lat); return [(x - CAM.x) * CAM.z + W / 2, (y - CAM.y) * CAM.z + H / 2]; };
const wsx = ([x, y]) => [(x - CAM.x) * CAM.z + W / 2, (y - CAM.y) * CAM.z + H / 2];
const F = (w, s, fam) => `${w} ${s}px ${fam || (SP.estilo !== 'documental' ? 'Fredoka' : 'Montserrat')}`;
const fade = (t, e, fi = .35, fo = .3) => Math.min(eo(pr(t, e.desde, fi)), 1 - pr(t, (e.hasta ?? 1e9) - fo, fo));
const activo = (t, e) => t >= e.desde && t <= (e.hasta ?? 1e9);

// ---------- texturas procedurales (ruido que se repite sin costuras) ----------
function hs(i, j, s) { let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(s, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vn(x, y, p, s) { const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const i0 = ((i % p) + p) % p, j0 = ((j % p) + p) % p, i1 = (i0 + 1) % p, j1 = (j0 + 1) % p;
  const a = hs(i0, j0, s), b = hs(i1, j0, s), c = hs(i0, j1, s), d = hs(i1, j1, s); return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(u, v, base, oct, s) { let t = 0, a = 1, n = 0, f = base; for (let k = 0; k < oct; k++) { t += a * vn(u * f, v * f, f, s + k * 17); n += a; a *= .5; f *= 2; } return t / n; }
function rid(u, v, base, oct, s) { let t = 0, a = 1, n = 0, f = base; for (let k = 0; k < oct; k++) { let r = 1 - Math.abs(2 * vn(u * f, v * f, f, s + k * 31) - 1); r *= r; t += a * r; n += a; a *= .55; f *= 2; } return t / n; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, p) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)];
function rampa(stops, h) { for (let i = 1; i < stops.length; i++) if (h <= stops[i][0]) { const [h0, c0] = stops[i - 1], [h1, c1] = stops[i]; return mix(hex(c0), hex(c1), cl((h - h0) / (h1 - h0))); } return hex(stops[stops.length - 1][1]); }
function textura(tipo) {
  const c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d'), im = x.createImageData(N, N), d = im.data;
  const h = new Float32Array(N * N), m = new Float32Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const u = i / N, v = j / N, k = j * N + i;
    if (tipo === 'monte') h[k] = .65 * rid(u, v, 4, 6, 7) + .35 * fbm(u, v, 3, 4, 9);
    else if (tipo === 'desierto') h[k] = fbm(u, v, 5, 5, 21);
    else if (tipo === 'mar') h[k] = fbm(u, v, 3, 5, 41);
    else { h[k] = fbm(u, v, 4, 6, 3); m[k] = fbm(u, v, 2, 4, 11); } }
  const g = new Float32Array(N * N); let sd = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const k = j * N + i, gx = h[j * N + (i + 1) % N] - h[j * N + (i + N - 1) % N], gy = h[((j + 1) % N) * N + i] - h[((j + N - 1) % N) * N + i]; g[k] = gx + gy; sd += g[k] * g[k]; }
  sd = Math.sqrt(sd / (N * N)) || 1;
  const K = { monte: .5, tierra: .22, desierto: .2, mar: .1 }[tipo];
  for (let k = 0; k < N * N; k++) { const sh = cl(1 + K * g[k] / sd, .5, 1.5); let col;
    if (tipo === 'monte') col = rampa([[0, '#4d4a30'], [.4, '#7a6a45'], [.62, '#a89470'], [.78, '#c9bfa6'], [.86, '#efece4'], [1, '#ffffff']], h[k]);
    else if (tipo === 'desierto') col = rampa([[0, '#a9875a'], [.5, '#c4a271'], [1, '#d9bd8a']], h[k]);
    else if (tipo === 'mar') col = rampa([[0, '#0a2635'], [1, '#12394c']], h[k]);
    else { col = rampa([[0, '#22461f'], [.42, '#2f5a27'], [.55, '#45702f'], [.7, '#62803c'], [1, '#7f8b4c']], h[k]); col = mix(col, hex('#8c8656'), cl((m[k] - .58) * 3)); }
    d[k * 4] = col[0] * sh; d[k * 4 + 1] = col[1] * sh; d[k * 4 + 2] = col[2] * sh; d[k * 4 + 3] = 255; }
  x.putImageData(im, 0, 0); return c;
}
function olas() { // textura de olas de caricatura
  const c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d');
  x.strokeStyle = 'rgba(255,255,255,.16)'; x.lineWidth = 4; x.lineCap = 'round';
  for (let k = 0; k < 26; k++) { const px = hs(k, 1, 5) * N, py = hs(k, 2, 5) * N, r = 14 + hs(k, 3, 5) * 10;
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) { x.beginPath(); x.arc(px + ox, py + oy, r, Math.PI * 1.15, Math.PI * 1.85); x.stroke(); x.beginPath(); x.arc(px + ox + r * 1.3, py + oy, r, Math.PI * 1.15, Math.PI * 1.85); x.stroke(); } }
  return c;
}
function grano() { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'), im = x.createImageData(256, 256);
  for (let k = 0; k < 256 * 256; k++) { const v = Math.random() * 255; im.data[k * 4] = im.data[k * 4 + 1] = im.data[k * 4 + 2] = v; im.data[k * 4 + 3] = 255; } x.putImageData(im, 0, 0); return c; }

// relleno con textura en coordenadas del mapa, mezclando dos escalas para que el detalle no se pierda con el zoom
function rellenar(c2, path, nombre, alpha = 1) {
  // se recorta con la forma en coordenadas del mapa y la textura se pinta en coordenadas de pantalla (precisión con zoom extremo)
  const L = Math.log2(CAM.z * S / N), k = Math.floor(L), f = L - k, md = (a, b) => ((a % b) + b) % b;
  const p = PAT[nombre] || (PAT[nombre] = c2.createPattern(TIL[nombre], 'repeat'));
  c2.save(); c2.clip(path, 'evenodd'); c2.setTransform(1, 0, 0, 1, 0, 0);
  for (let j = 0; j < 2; j++) { const ts = CAM.z * S * Math.pow(2, -(k + j)), ox = md(W / 2 - CAM.x * CAM.z, ts), oy = md(H / 2 - CAM.y * CAM.z, ts);
    p.setTransform(new DOMMatrix([ts / N, 0, 0, ts / N, ox, oy])); c2.globalAlpha = alpha * (j ? f : 1); c2.fillStyle = p; c2.fillRect(0, 0, W, H); }
  c2.restore(); c2.globalAlpha = 1;
}

// ---------- datos ----------
function armarPaises(lista) {
  return lista.map(p => { p.pp = p.polys.map(r => { const path = new Path2D(); r.rings.forEach(ring => { path.moveTo(ring[0], ring[1]); for (let i = 2; i < ring.length; i += 2) path.lineTo(ring[i], ring[i + 1]); path.closePath(); }); return { path, bb: r.bb }; });
    p.path = new Path2D(); p.pp.forEach(q => p.path.addPath(q.path)); return p; });
}
function armarCapas(lista) { return lista.map(r => { const path = new Path2D(); r.rings.forEach(ring => { path.moveTo(ring[0], ring[1]); for (let i = 2; i < ring.length; i += 2) path.lineTo(ring[i], ring[i + 1]); path.closePath(); }); return { path, bb: r.bb }; }); }
function armarLineas(lista) { return lista.map(r => { const path = new Path2D(); path.moveTo(r.c[0], r.c[1]); for (let i = 2; i < r.c.length; i += 2) path.lineTo(r.c[i], r.c[i + 1]); return { path, bb: r.bb }; }); }

async function init(geo, spec, flags, imgs) {
  SP = spec; G = {};
  if (spec.formato === 'vertical') { W = 1080; H = 1920; cv.width = W; cv.height = H; }
  for (const k of Object.keys(geo)) G[k] = k === 'rios' ? armarLineas(geo[k]) : (k === 'montes' || k === 'desiertos') ? armarCapas(geo[k]) : armarPaises(geo[k]);
  G.idx = {}; (G.paises || G.hi || []).forEach(p => G.idx[p.adm] = p); (G.estados || []).forEach(p => G.idx[p.adm] = p);
  G.regiones = (SP.regiones || []).map(r => { const path = new Path2D(); let bb = [1e9, 1e9, -1e9, -1e9]; for (const id of r.partes) { const c = G.idx[id]; if (!c) continue; path.addPath(c.path); bb = [Math.min(bb[0], c.bb[0]), Math.min(bb[1], c.bb[1]), Math.max(bb[2], c.bb[2]), Math.max(bb[3], c.bb[3])]; } return Object.assign({}, r, { path, bb }); }); if (G.lo) { G.idxLo = {}; G.lo.forEach(p => G.idxLo[p.adm] = p); }
  await Promise.all(Object.entries(flags).map(async ([iso, url]) => { const im = new Image(); im.src = url; await im.decode().catch(() => {});
    const c = document.createElement('canvas'); c.width = 640; c.height = 480; const x = c.getContext('2d'); try { x.drawImage(im, 0, 0, 640, 480); } catch (e) {}
    FLC[iso] = c; const s = document.createElement('canvas'); s.width = s.height = 1; const sx = s.getContext('2d'); sx.drawImage(c, 0, 0, 1, 1); const d = sx.getImageData(0, 0, 1, 1).data; FLCOL[iso] = `rgb(${d[0]},${d[1]},${d[2]})`;
    const pc = []; for (const [u, v] of [[.15, .2], [.5, .5], [.85, .8], [.5, .15], [.2, .8]]) pc.push(`rgb(${x.getImageData(u * 639, v * 479, 1, 1).data.slice(0, 3).join(',')})`); FLC[iso].colores = pc; }));
  await Promise.all(Object.entries(imgs).map(async ([k, url]) => { const im = new Image(); im.src = url; await im.decode(); IM[k] = im; }));
  if (SP.estilo === 'documental') { for (const t of ['tierra', 'monte', 'desierto', 'mar']) TIL[t] = textura(t); }
  else TIL.olas = olas();
  GRANO = ctx.createPattern(grano(), 'repeat');
  OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H; octx = OFF.getContext('2d');
  return 'ok';
}

// ---------- cámara ----------
function camara(t) {
  const k = SP.camara; let i = 0; while (i < k.length - 1 && t >= k[i + 1].t) i++;
  const a = k[i], b = k[Math.min(i + 1, k.length - 1)];
  const [ax, ay] = proj(a.lon, a.lat), [bx, by] = proj(b.lon, b.lat);
  const za = Math.log(W / (a.ancho / 360 * S)), zb = Math.log(W / (b.ancho / 360 * S));
  const q = b === a ? 0 : cl((t - a.t) / (b.t - a.t)), p = b.suave === false ? q : eio(q);
  // el centro viaja en proporción al zoom para que el movimiento se vea parejo
  let zl = lerp(za, zb, p) - (b.arco || 0) * Math.sin(Math.PI * p);
  const tremor = SP.estilo === 'documental' ? 0 : 0;
  CAM = { x: lerp(ax, bx, p) + tremor, y: lerp(ay, by, p), z: Math.exp(zl) };
  if (SP.sacudidas) for (const s of SP.sacudidas) { const u = pr(t, s.t, s.dur || .5); if (u > 0 && u < 1) { const a2 = (s.fuerza || 12) * (1 - u) / CAM.z; CAM.x += Math.sin(t * 95) * a2; CAM.y += Math.cos(t * 83) * a2; } }
}
const setCam = (c2 = ctx) => c2.setTransform(CAM.z, 0, 0, CAM.z, W / 2 - CAM.x * CAM.z, H / 2 - CAM.y * CAM.z);
function vista(m = .05) { const hw = W / 2 / CAM.z * (1 + m), hh = H / 2 / CAM.z * (1 + m); return [CAM.x - hw, CAM.y - hh, CAM.x + hw, CAM.y + hh]; }
const cruza = (bb, v) => !(bb[2] < v[0] || bb[0] > v[2] || bb[3] < v[1] || bb[1] > v[3]);

// ---------- estilo documental ----------
function tierraVisible(lista) { const v = vista(), p = new Path2D(); for (const c of lista) { if (!cruza(c.bb, v)) continue; for (const q of c.pp) if (cruza(q.bb, v)) p.addPath(q.path); } return p; }
function capaSuave(lista, textu, tierra, blur, alpha) {
  const v = vista(.2); octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, W, H); octx.globalCompositeOperation = 'source-over';
  setCam(octx); octx.filter = `blur(${blur}px)`; octx.fillStyle = '#fff'; let n = 0;
  for (const q of lista) if (cruza(q.bb, v)) { octx.fill(q.path, 'evenodd'); n++; }
  octx.filter = 'none'; if (!n) return;
  octx.globalCompositeOperation = 'source-in'; const todo = new Path2D(); const vv = vista(.3); todo.rect(vv[0], vv[1], vv[2] - vv[0], vv[3] - vv[1]); rellenar(octx, todo, textu);
  octx.globalCompositeOperation = 'destination-in'; octx.fillStyle = '#fff'; octx.fill(tierra, 'evenodd');
  octx.globalCompositeOperation = 'source-over'; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = alpha; ctx.drawImage(OFF, 0, 0); ctx.globalAlpha = 1;
}
function mapaDoc(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 1150); g.addColorStop(0, '#0f3447'); g.addColorStop(1, '#061520'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  setCam(); const vv = vista(.3), todo = new Path2D(); todo.rect(vv[0], vv[1], vv[2] - vv[0], vv[3] - vv[1]);
  rellenar(ctx, todo, 'mar', .35);
  const ancho = W / CAM.z / S * 360, lista = ancho > 25 ? G.lo : G.hi, tierra = tierraVisible(lista);
  // plataforma continental: brillo turquesa alrededor de la costa
  ctx.save(); ctx.fillStyle = '#0e3243'; ctx.shadowColor = 'rgba(55,165,185,.42)'; ctx.shadowBlur = 110; ctx.fill(tierra, 'evenodd');
  ctx.shadowColor = 'rgba(100,205,210,.55)'; ctx.shadowBlur = 28; ctx.fill(tierra, 'evenodd'); ctx.restore(); setCam();
  rellenar(ctx, tierra, 'tierra');
  // clima por latitud: verde intenso en el trópico, más seco y gris hacia los polos
  const [, yN] = proj(0, 62), [, yS] = proj(0, -62), [, y0] = proj(0, 0), lg = ctx.createLinearGradient(0, yN, 0, yS);
  lg.addColorStop(0, 'rgba(150,150,120,.45)'); lg.addColorStop(cl((y0 - yN) / (yS - yN) - .12), 'rgba(40,80,30,.0)'); lg.addColorStop((y0 - yN) / (yS - yN), 'rgba(20,70,20,.18)'); lg.addColorStop(cl((y0 - yN) / (yS - yN) + .12), 'rgba(40,80,30,0)'); lg.addColorStop(1, 'rgba(150,150,120,.45)');
  ctx.fillStyle = lg; ctx.fill(tierra, 'evenodd');
  const blur = cl(CAM.z * S * .0009, 3, 36);
  capaSuave(G.desiertos, 'desierto', tierra, blur, .85);
  capaSuave(G.montes, 'monte', tierra, blur * 1.3, .95);
  setCam();
  for (const iso of ['GRL', 'ATA']) { const c = (lista === G.lo ? G.idxLo : G.idx)[iso]; if (c) { ctx.fillStyle = 'rgba(225,232,236,.9)'; ctx.fill(c.path, 'evenodd'); } }
  if (ancho < 70) { ctx.strokeStyle = `rgba(110,175,205,${cl((70 - ancho) / 40) * .55})`; ctx.lineWidth = 1.3 / CAM.z; ctx.lineJoin = 'round'; const v = vista(); for (const r of G.rios) if (cruza(r.bb, v)) ctx.stroke(r.path); }
  ctx.strokeStyle = 'rgba(255,245,215,.30)'; ctx.lineWidth = 1.1 / CAM.z; const v = vista(); for (const c of lista) if (cruza(c.bb, v)) ctx.stroke(c.path);
  ctx.strokeStyle = 'rgba(225,240,225,.22)'; ctx.lineWidth = 1.4 / CAM.z; ctx.stroke(tierra);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const vg = ctx.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1150); vg.addColorStop(0, 'rgba(3,10,16,0)'); vg.addColorStop(1, 'rgba(3,10,16,.7)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(4,14,22,.12)'; ctx.fillRect(0, 0, W, H);
}

// ---------- estilo caricatura ----------
function desaparicion(iso, t) { const d = (SP.desaparece || []).find(x => x.iso === iso); if (!d) return null; return t - d.t; }
function mapaCarto(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 1200); g.addColorStop(0, '#3a95d6'); g.addColorStop(1, '#1f6aa8'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  setCam(); const vv = vista(.3), todo = new Path2D(); todo.rect(vv[0], vv[1], vv[2] - vv[0], vv[3] - vv[1]);
  { const L = Math.log2(CAM.z * S / N), k = Math.floor(L), s = S * Math.pow(2, -k); const p = PAT.olas || (PAT.olas = ctx.createPattern(TIL.olas, 'repeat')); p.setTransform(new DOMMatrix([s / N, 0, 0, s / N, (t * .002 * s) % s, 0])); ctx.fillStyle = p; ctx.fill(todo); }
  const v = vista(); FACE = {};
  const lista = G.paises.filter(c => cruza(c.bb, v));
  for (const c of lista) {
    const dt = desaparicion(c.adm, t); ctx.save();
    if (dt !== null && dt > 0) {
      if (dt > 1.25) { ctx.restore(); continue; }
      const [cx, cy] = proj(c.lx, c.ly);
      if (dt < .45) { const a = 5 / CAM.z; ctx.translate(Math.sin(t * 90) * a, Math.cos(t * 77) * a); }
      else { const q = eio(pr(dt, .45, .8)); ctx.translate(cx, cy); ctx.scale(1 - q * .9, 1 - q * .9); ctx.translate(-cx, -cy); ctx.globalAlpha = 1 - q; }
    }
    paisBandera(c);
    { const m = marcado(c.adm, t); if (m > 0) { ctx.fillStyle = `rgba(214,40,40,${m * (.55 + .2 * Math.sin(t * 7))})`; ctx.fill(c.path, 'evenodd'); } }
    if (dt !== null && dt > 0 && dt < .6) { ctx.fillStyle = `rgba(255,255,255,${Math.sin(pr(dt, 0, .6) * Math.PI) * .8})`; ctx.fill(c.path, 'evenodd'); }
    ctx.restore(); setCam();
  }
  ctx.lineJoin = 'round';
  for (const c of lista) { const dt = desaparicion(c.adm, t); if (dt !== null && dt > .45) continue; ctx.strokeStyle = 'rgba(15,30,45,.55)'; ctx.lineWidth = 4.5 / CAM.z; ctx.stroke(c.path); }
  for (const c of lista) { const dt = desaparicion(c.adm, t); if (dt !== null && dt > .45) continue; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.8 / CAM.z; ctx.stroke(c.path); }
  // hueco del país que desapareció
  for (const d of SP.desaparece || []) { const c = G.idx[d.iso], dt = t - d.t; if (!c || dt < .4) continue;
    if (dt >= .9) { const a = eo(pr(dt, .9, .6)); ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(8,30,55,.28)'; ctx.fill(c.path, 'evenodd'); ctx.setLineDash([12 / CAM.z, 9 / CAM.z]); ctx.lineDashOffset = -t * 40 / CAM.z;
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3 / CAM.z; ctx.stroke(c.path); ctx.restore(); setCam(); }
