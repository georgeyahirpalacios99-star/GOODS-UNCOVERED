<!doctype html>
<html><head><meta charset="utf-8"><title>Motor Shorts</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const C = document.getElementById('c'), ctx = C.getContext('2d');

// Paleta Goods Uncovered (videos/001-mercancia-perdida/04-PRODUCCION.md)
const ACERO = '#0E2433', OXIDO = '#C4581F', CONCRETO = '#8A8F94', NIEBLA = '#E8E6E1', ALQUITRAN = '#0A0C0E';
const SANS = 'Inter';

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const pr = (t, a, d) => clamp((t - a) / d);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

let SPEC, T, SEGS, IM, DURATION;

// ---------- grano ----------
const grains = [0, 1, 2, 3].map(i => {
  const g = document.createElement('canvas'); g.width = 360; g.height = 640;
  const gx = g.getContext('2d'), im = gx.createImageData(360, 640), r = rng(i + 7);
  for (let p = 0; p < im.data.length; p += 4) { const v = r() * 255; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255; }
  gx.putImageData(im, 0, 0); return g;
});

// ---------- init: lo llama render.cjs ----------
async function init(spec, timing, imgs) {
  SPEC = spec; T = timing; DURATION = timing[timing.length - 1].end;
  SEGS = [...spec.items, spec.cierre];
  IM = await Promise.all(imgs.map(src => src ? new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }) : null));
  SEGS.forEach((s, i) => {
    // Reparte el tiempo de habla entre palabras según su largo (no hay transcripción palabra por palabra)
    const words = s.narracion.split(/\s+/).filter(Boolean), tm = T[i];
    const weights = words.map(w => w.length + 2), total = weights.reduce((a, b) => a + b, 0);
    let acc = 0;
    s._words = words.map((w, k) => { const a = tm.speechStart + (tm.speechEnd - tm.speechStart) * acc / total; acc += weights[k]; return { w, a }; });
    s._reveal = tm.speechStart + (tm.speechEnd - tm.speechStart) * .6;
    if (s.respuesta) {
      const pos = norm(s.narracion).lastIndexOf(norm(s.respuesta));
      if (pos >= 0) {
        const k = s.narracion.slice(0, pos).split(/\s+/).filter(Boolean).length;
        if (s._words[k]) s._reveal = s._words[k].a;
      }
    }
  });
}

// ---------- texto ----------
function wrap(text, font, maxW) {
  ctx.font = font; const out = []; let cur = '';
  text.split(' ').forEach(w => { const tr = cur ? cur + ' ' + w : w; if (ctx.measureText(tr).width > maxW && cur) { out.push(cur); cur = w; } else cur = tr; });
  if (cur) out.push(cur); return out;
}
function strokeText(txt, x, y, font, fill, stroke = ALQUITRAN, sw = 14) {
  ctx.font = font; ctx.lineJoin = 'round'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}

// ---------- fondo ----------
function cover(img, k, dir) {
  if (img.width / img.height > .8) {
    // Imagen horizontal: fondo desenfocado y la imagen completa al centro, para no estirarla
    const bs = Math.max(W / img.width, H / img.height) * 1.1;
    ctx.save(); ctx.filter = 'blur(40px) brightness(.55)';
    ctx.drawImage(img, (W - img.width * bs) / 2, (H - img.height * bs) / 2, img.width * bs, img.height * bs);
    ctx.restore();
    const fs = W / img.width * (1.02 + .08 * k), fw = img.width * fs, fh = img.height * fs;
    ctx.drawImage(img, (W - fw) / 2 + dir * (k - .5) * 20, (H - fh) / 2, fw, fh);
    return;
  }
  const sc = Math.max(W / img.width, H / img.height) * (1.06 + .1 * k);
  const w = img.width * sc, h = img.height * sc;
  const dx = (W - w) / 2 + dir * (k - .5) * 40, dy = (H - h) / 2;
  ctx.drawImage(img, dx, dy, w, h);
}
function placeholder(i, k) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, ACERO); g.addColorStop(1, ALQUITRAN);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .9;
  strokeText(`IMAGEN ${String(i + 1).padStart(2, '0')}`, W / 2, H / 2 - 40, `900 120px ${SANS}`, CONCRETO, 'transparent', 0);
  strokeText(`falta ${SEGS[i].imagen || String(i + 1).padStart(2, '0')}.png`, W / 2, H / 2 + 60, `500 44px ${SANS}`, CONCRETO, 'transparent', 0);
  ctx.restore();
}
function shade() {
  let g = ctx.createLinearGradient(0, 0, 0, 760); g.addColorStop(0, 'rgba(10,12,14,.88)'); g.addColorStop(1, 'rgba(10,12,14,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 760);
  g = ctx.createLinearGradient(0, 1100, 0, H); g.addColorStop(0, 'rgba(10,12,14,0)'); g.addColorStop(1, 'rgba(10,12,14,.92)');
  ctx.fillStyle = g; ctx.fillRect(0, 1100, W, H - 1100);
  g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- capas ----------
function etiqueta(s, lt) {
  const p = back(pr(lt, .05, .4)); if (p <= 0) return;
  const font = `900 78px ${SANS}`, lines = wrap(s.etiqueta.toUpperCase(), font, 880);
  ctx.save(); ctx.globalAlpha = clamp(p); ctx.translate(W / 2, 330); ctx.scale(.85 + .15 * p, .85 + .15 * p);
  lines.forEach((l, j) => strokeText(l, 0, j * 92, font, NIEBLA, ALQUITRAN, 16));
  ctx.restore();
}
function contador(i, lt) {
  const n = SPEC.items.length; if (i >= n) return;
  const p = eo(pr(lt, 0, .3)); if (p <= 0) return;
  ctx.save(); ctx.globalAlpha = p;
  const txt = `#${i + 1}`, font = `900 54px ${SANS}`; ctx.font = font;
  const w = ctx.measureText(txt).width + 56;
  ctx.fillStyle = OXIDO; ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, 190, w, 76, 38); ctx.fill();
  strokeText(txt, W / 2, 230, font, NIEBLA, 'transparent', 0);
  ctx.restore();
}
function respuesta(s, t) {
  if (!s.respuesta) return;
  const p = back(pr(t, s._reveal, .35)); if (p <= 0) return;
  const font = `900 112px ${SANS}`, lines = wrap(s.respuesta.toUpperCase(), font, 860);
  ctx.font = font; const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 80, h = lines.length * 124 + 50;
  ctx.save(); ctx.translate(W / 2, 1150); ctx.rotate(-.025); ctx.scale(p, p);
  ctx.fillStyle = OXIDO; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 22); ctx.fill(); ctx.shadowColor = 'transparent';
  lines.forEach((l, j) => strokeText(l, 0, -((lines.length - 1) * 124) / 2 + j * 124 + 4, font, NIEBLA, 'transparent', 0));
  ctx.restore();
}
function subtitulos(s, t) {
  const ws = s._words; let k = -1;
  for (let j = 0; j < ws.length; j++) if (t >= ws[j].a) k = j;
  if (k < 0) return;
  const c0 = Math.floor(k / 3) * 3, chunk = ws.slice(c0, c0 + 3);
  const font = `900 70px ${SANS}`; ctx.font = font;
  const sp = ctx.measureText(' ').width + 22, widths = chunk.map(c => ctx.measureText(c.w.toUpperCase()).width);
  let x = W / 2 - (widths.reduce((a, b) => a + b, 0) + sp * (chunk.length - 1)) / 2;
  chunk.forEach((c, j) => {
    const on = c0 + j === k, cx = x + widths[j] / 2, pop = on ? 1 + .08 * (1 - eo(pr(t, c.a, .15))) : 1;
    ctx.save(); ctx.translate(cx, 1440); ctx.scale(pop, pop);
    if (on) { ctx.fillStyle = OXIDO; ctx.beginPath(); ctx.roundRect(-widths[j] / 2 - 14, -46, widths[j] + 28, 92, 14); ctx.fill(); }
    strokeText(c.w.toUpperCase(), 0, 4, font, NIEBLA, ALQUITRAN, on ? 0 : 12);
    ctx.restore(); x += widths[j] + sp;
  });
}
function cierre(s, lt) {
  const p = back(pr(lt, .1, .5)); if (p <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(p);
  strokeText('GOODS UNCOVERED', W / 2, 860, `900 96px ${SANS}`, NIEBLA, ALQUITRAN, 16);
  ctx.fillStyle = OXIDO; ctx.fillRect(W / 2 - 330 * p, 930, 660 * p, 12);
  ctx.restore();
}

// ---------- frame ----------
function render(t) {
  let i = T.findIndex(s => t < s.end); if (i < 0) i = T.length - 1;
  const tm = T[i], s = SEGS[i], lt = t - tm.start, k = clamp(lt / (tm.end - tm.start));
  ctx.save();
  const punch = 1 + .06 * (1 - eo(pr(lt, 0, .25)));
  ctx.translate(W / 2, H / 2); ctx.scale(punch, punch); ctx.translate(-W / 2, -H / 2);
  if (IM[i]) cover(IM[i], k, i % 2 ? 1 : -1); else placeholder(i, k);
  ctx.restore();
  shade();
  if (i < SPEC.items.length) { contador(i, lt); etiqueta(s, lt); respuesta(s, t); }
  else cierre(s, lt);
  subtitulos(s, t);
  // barra de progreso
  ctx.fillStyle = 'rgba(232,230,225,.25)'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = OXIDO; ctx.fillRect(0, 0, W * clamp(t / DURATION), 10);
  // flash de corte
  const f = 1 - pr(lt, 0, .12);
  if (i > 0 && f > 0) { ctx.fillStyle = `rgba(232,230,225,${.55 * f})`; ctx.fillRect(0, 0, W, H); }
  ctx.save(); ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grains[Math.floor(t * 24) % 4], 0, 0, W, H); ctx.restore();
}
</script>
</body></html>
